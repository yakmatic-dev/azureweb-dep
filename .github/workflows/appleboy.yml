name: Build and deploy JAR app via SSH with PM2 - petclinic

on:
  push:
    branches:
      - test1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Copy JAR to server via SCP
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "*.jar"
          target: ${{ secrets.SERVER_DEPLOY_PATH }}

      - name: Start/Restart app with PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Use home directory for PM2 to avoid permission issues
            export PM2_HOME=$HOME/.pm2

            # Stop existing app if running
            pm2 delete spring-petclinic || true

            # Start the new JAR
            pm2 start ${{ secrets.SERVER_DEPLOY_PATH }}/spring-petclinic.jar \
              --name spring-petclinic \
              --interpreter java \
              -- -jar ${{ secrets.SERVER_DEPLOY_PATH }}/spring-petclinic.jar --spring.profiles.active=prod

            # Save PM2 process list for auto restart on reboot
            pm2 save
