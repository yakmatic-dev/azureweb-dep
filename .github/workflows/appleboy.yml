name: Build and deploy Dockerized JAR - petclinic

on:
  push:
    branches:
      - test1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build -t spring-petclinic:latest .

      - name: Save Docker image as artifact
        run: docker save spring-petclinic:latest -o spring-petclinic.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: spring-petclinic.tar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    permissions:
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Copy Docker image to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "spring-petclinic.tar"
          target: ${{ secrets.SERVER_DEPLOY_PATH }}

      - name: Load and run Docker container on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH }}

            # Load Docker image
            docker load -i spring-petclinic.tar

            # Stop old container if running
            docker rm -f spring-petclinic || true

            # Run new container
            docker run -d --name spring-petclinic -p 8080:8080 spring-petclinic:latest
