name: Build and deploy JAR app via SSH with PM2 - petclinic

on:
  push:
    branches:
      - test1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy via SSH using username/password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Stop the current app via PM2 if running
            pm2 delete spring-petclinic || true

            # Copy the new JAR to deployment path
            mkdir -p ${{ secrets.SERVER_DEPLOY_PATH }}
            cp $GITHUB_WORKSPACE/*.jar ${{ secrets.SERVER_DEPLOY_PATH }}/spring-petclinic.jar

            # Start the app using PM2
            pm2 start java --name spring-petclinic -- -jar ${{ secrets.SERVER_DEPLOY_PATH }}/spring-petclinic.jar 

            # Save the PM2 process list
            pm2 save
